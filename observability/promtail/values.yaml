# Promtail standalone values (if deployed separately from loki-stack)
# NOTE: When using loki-stack chart, promtail is bundled — this file
# documents the standalone configuration for reference.

image:
  repository: grafana/promtail
  tag: 3.5.1
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

config:
  logLevel: info
  serverPort: 3101
  clients:
    - url: http://loki-stack.monitoring.svc.cluster.local:3100/loki/api/v1/push

  snippets:
    # Extra pipeline stages for Falco log parsing
    extraScrapeConfigs: |
      - job_name: falco-events
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: falco
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - replacement: falco
            target_label: job
        pipeline_stages:
          - json:
              expressions:
                output: output
                priority: priority
                rule: rule
          - labels:
              priority:
              rule:
