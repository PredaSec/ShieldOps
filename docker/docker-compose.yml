services:
  gitlab:
    image: 'gitlab/gitlab-ce:latest'
    container_name: gitlab
    restart: always
    hostname: 'gitlab.local'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
    ports:
      - '8929:8929'
      - '2224:22'
    volumes:
      - './gitlab/config:/etc/gitlab'
      - './gitlab/logs:/var/log/gitlab'
      - './gitlab/data:/var/opt/gitlab'
    networks:
      - shieldops-net

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shieldops
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: tasks_db
    ports:
      - "5432:5432"
    volumes:
      - './postgres/data:/var/lib/postgresql/data'
    networks:
      - shieldops-net

  localstack:
    image: localstack/localstack:3.8.0
    container_name: localstack
    restart: unless-stopped
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # external services port range
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./localstack/volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - shieldops-net

  # Local OCI registry (replaces ECR for the local POC). The CI pipeline (Phase 3)
  # builds images and pushes them here; kind pulls/loads from here.
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - './registry/data:/var/lib/registry'
    networks:
      - shieldops-net

networks:
  shieldops-net:
    driver: bridge
