server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly; fall back to index.html for SPA-style routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy /api/ to the backend service on port 3001.
    # The upstream hostname "backend" resolves via Docker Compose / K8s service DNS.
    location /api/ {
        proxy_pass         http://backend:3001/api/;
        proxy_http_version 1.1;
        # Explicit upstream host (avoids using the attacker-controllable Host header).
        proxy_set_header   Host              backend;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Health endpoint for the frontend container itself.
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
