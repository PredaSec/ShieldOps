kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  # Open node ports to allow host access to services inside the cluster
  extraPortMappings:
  - containerPort: 30000
    hostPort: 30000
    protocol: TCP
  - containerPort: 30001
    hostPort: 30001
    protocol: TCP
  # Mount the Docker socket so tools inside K8s can interact with it if needed
  extraMounts:
    - hostPath: /var/run/docker.sock
      containerPath: /var/run/docker.sock
